name: Cyclone CDR C++ vector minimum-wire differential
on:
  push:
    branches:
      - research/jazzy-cdr-cpp-vector-minwire-20261102
    paths:
      - .github/workflows/cyclone-cpp-vector-minwire.yml
      - rmw_cyclonedds_cpp/src/serdes.hpp
      - research_tests/cpp_vector_wire_min_probe.cpp
      - research_tests/check_cpp_vector_minwire.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record exact commit and ROS container
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/experiment-commit.txt
          git rev-parse HEAD:rmw_cyclonedds_cpp/src/serdes.hpp > evidence/patched-header-blob.txt
          docker pull ros:jazzy-ros-base
          docker inspect --format '{{.Id}}' ros:jazzy-ros-base > evidence/container-id.txt
      - name: Compare exact unmodified Jazzy with scoped header preflight
        run: |
          docker run --rm --memory=256m --memory-swap=256m --ulimit core=0 \
            -v "$PWD:/source:ro" -v "$PWD/evidence:/evidence" \
            ros:jazzy-ros-base bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq g++ git ros-jazzy-cyclonedds
              dpkg-query -W ros-jazzy-cyclonedds > /evidence/cyclonedds-version.txt
              git clone --quiet --filter=blob:none --no-checkout https://github.com/ros2/rmw_cyclonedds.git /tmp/rmwbase
              git -C /tmp/rmwbase fetch --quiet --depth=1 origin 20b192ae744f2fe56767e68081a46ad0d7f7a0ec
              git -C /tmp/rmwbase checkout --quiet --detach FETCH_HEAD
              test "$(git -C /tmp/rmwbase rev-parse HEAD)" = "20b192ae744f2fe56767e68081a46ad0d7f7a0ec"
              base=/tmp/rmwbase/rmw_cyclonedds_cpp/src
              fixed=/source/rmw_cyclonedds_cpp/src
              cmp "$base/serdes.cpp" "$fixed/serdes.cpp"
              cmp "$base/exception.cpp" "$fixed/exception.cpp"
              cmp "$base/deserialization_exception.cpp" "$fixed/deserialization_exception.cpp"
              for arm in baseline patched; do
                if [ "$arm" = baseline ]; then src="$base"; else src="$fixed"; fi
                header=$(find /opt/ros/jazzy/include -path "*/dds/ddsrt/endian.h" -print -quit)
                test -n "$header"
                include=$(dirname "$(dirname "$(dirname "$header")")")
                g++ -std=c++17 -O0 -I"$src" -I"$include" \
                  /source/research_tests/cpp_vector_wire_min_probe.cpp \
                  "$src/serdes.cpp" "$src/exception.cpp" "$src/deserialization_exception.cpp" \
                  -o "/evidence/vector-probe-$arm"
                sha256sum "/evidence/vector-probe-$arm" > "/evidence/$arm-binary.sha256"
                ulimit -v 200000
                "/evidence/vector-probe-$arm" > "/evidence/$arm.txt" 2>&1
                cat "/evidence/$arm.txt"
              done
              /usr/bin/python3 /source/research_tests/check_cpp_vector_minwire.py > /evidence/comparison-verified.json
              cat /evidence/comparison-verified.json
            '
      - name: Preserve positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-cpp-vector-minwire
          path: evidence/
