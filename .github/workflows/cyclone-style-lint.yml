name: Cyclone Jazzy upstream ament lint compliance
on:
  push:
    branches:
      - research/jazzy-zero-width-nested-valid-control-20261102
    paths:
      - .github/workflows/cyclone-style-lint.yml
      - rmw_cyclonedds_cpp/src/TypeSupport_impl.hpp
      - rmw_cyclonedds_cpp/src/serdes.hpp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ament-lints:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint source and container
        run: |
          mkdir -p lint-evidence
          git rev-parse HEAD > lint-evidence/commit.txt
          git rev-parse HEAD:rmw_cyclonedds_cpp/src/TypeSupport_impl.hpp > lint-evidence/typesupport-blob.txt
          git rev-parse HEAD:rmw_cyclonedds_cpp/src/serdes.hpp > lint-evidence/serdes-blob.txt
          docker pull ros:jazzy-ros-base
          docker inspect --format '{{.Id}}' ros:jazzy-ros-base > lint-evidence/container-id.txt
      - name: Build with repository testing enabled and run ament lint
        run: |
          docker run --rm --memory=2g --memory-swap=2g --ulimit core=0 \
            -v "$PWD:/source:ro" -v "$PWD/lint-evidence:/evidence" \
            ros:jazzy-ros-base bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq g++ cmake ninja-build python3-colcon-common-extensions \
                ros-jazzy-rmw-cyclonedds-cpp \
                ros-jazzy-ament-lint-auto ros-jazzy-ament-lint-common
              source /opt/ros/jazzy/setup.bash
              export AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS=1
              dpkg-query -W ros-jazzy-rmw-cyclonedds-cpp \
                ros-jazzy-ament-lint-auto ros-jazzy-ament-lint-common \
                > /evidence/packages.txt
              cd /source
              colcon --log-base /tmp/lint-build-logs build \
                --merge-install --base-paths /source/rmw_cyclonedds_cpp \
                --packages-select rmw_cyclonedds_cpp \
                --build-base /tmp/lint-build \
                --install-base /tmp/lint-install \
                --event-handlers console_cohesion+ \
                --cmake-args -DBUILD_TESTING=ON \
                > /evidence/build.log 2>&1
              set +e
              colcon --log-base /tmp/lint-test-logs test --merge-install \
                --packages-select rmw_cyclonedds_cpp \
                --build-base /tmp/lint-build \
                --install-base /tmp/lint-install \
                --event-handlers console_cohesion+ \
                > /evidence/test.log 2>&1
              test_rc=$?
              colcon --log-base /tmp/lint-test-logs test-result \
                --test-result-base /tmp/lint-build --verbose \
                > /evidence/test-result.txt 2>&1
              result_rc=$?
              set -e
              printf "colcon_test=%s colcon_test_result=%s\n" "$test_rc" "$result_rc" \
                > /evidence/exit-codes.txt
              cat /evidence/test-result.txt
              echo "----- colcon build log (last 100 lines) -----"
              tail -n 100 /evidence/build.log
              echo "----- colcon test log (last 200 lines) -----"
              tail -n 200 /evidence/test.log
              test "$test_rc" -eq 0
              test "$result_rc" -eq 0
            '
      - name: Preserve lint results on pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-jazzy-ament-lint
          path: lint-evidence/
