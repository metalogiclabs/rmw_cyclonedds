name: Cyclone Jazzy combined C and C++ preflight native smoke
on:
  push:
    branches:
      - research/jazzy-cdr-combined-preflight-20261102
    paths:
      - .github/workflows/cyclone-combined-jazzy-smoke.yml
      - rmw_cyclonedds_cpp/src/serdes.hpp
      - rmw_cyclonedds_cpp/src/TypeSupport_impl.hpp
      - research_tests/combined_native_smoke.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-built-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Source fingerprint
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse HEAD:rmw_cyclonedds_cpp/src/serdes.hpp > evidence/serdes-blob.txt
          git rev-parse HEAD:rmw_cyclonedds_cpp/src/TypeSupport_impl.hpp > evidence/typesupport-blob.txt
          docker pull ros:jazzy-ros-base
          docker inspect --format '{{.Id}}' ros:jazzy-ros-base > evidence/container-id.txt
      - name: Compile native middleware and run bounded real ROS tests
        run: |
          docker run --rm --memory=2g --memory-swap=2g --ulimit core=0 \
            -v "$PWD:/source:ro" -v "$PWD/evidence:/evidence" \
            ros:jazzy-ros-base bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq g++ cmake ninja-build python3-colcon-common-extensions \
                ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-test-msgs
              set +u
              source /opt/ros/jazzy/setup.bash
              set -u
              dpkg-query -W ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-test-msgs ros-jazzy-rclpy \
                > /evidence/packages.txt
              colcon --log-base /tmp/cyclone-native-logs build \
                --merge-install --base-paths /source/rmw_cyclonedds_cpp \
                --packages-select rmw_cyclonedds_cpp \
                --build-base /tmp/cyclone-native-build \
                --install-base /tmp/cyclone-native-install \
                --event-handlers console_cohesion+ \
                --cmake-args -DBUILD_TESTING=OFF \
                > /evidence/colcon-build.log 2>&1
              test -f /tmp/cyclone-native-install/lib/librmw_cyclonedds_cpp.so
              sha256sum /tmp/cyclone-native-install/lib/librmw_cyclonedds_cpp.so > /evidence/library.sha256
              export LD_LIBRARY_PATH="/tmp/cyclone-native-install/lib:$LD_LIBRARY_PATH"
              export EXPECTED_LIB_DIR=/tmp/cyclone-native-install/lib
              export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
              ulimit -t 30
              /usr/bin/python3 /source/research_tests/combined_native_smoke.py \
                > /evidence/smoke.json 2> /evidence/smoke.stderr
              cat /evidence/smoke.json
            '
      - name: Archive even failed build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-jazzy-combined-native
          path: evidence/
